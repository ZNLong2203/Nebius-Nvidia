name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv pip install --system -e ".[contree,dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        # No network and no credentials: a scripted model stands in for Nemotron
        # and directory snapshots for Nebius Sandboxes.
        run: pytest -q

      - name: Build the web UI
        if: matrix.python-version == '3.12'
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: The bundled example really is broken
        run: |
          cd examples/broken-invoice
          if python -m pytest -q; then
            echo "::error::examples/broken-invoice is supposed to fail — the demo target is stale"
            exit 1
          fi
