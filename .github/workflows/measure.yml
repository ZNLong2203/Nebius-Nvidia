name: Measure

# The evaluation behind the README's numbers, run on GitHub's machines rather
# than a laptop: the first attempt stalled for hours because a closed lid put
# the machine to sleep mid-sweep.
#
# Manual only. It spends Token Factory credits and runs for hours, so nothing
# triggers it but a person, and secrets are never exposed to pull requests from
# forks. Results come back as artifacts, to be reviewed and committed by hand.
#
# This is the one workflow that holds API keys, so every action in it is pinned
# to a commit rather than a tag: a tag can be moved to new code by whoever
# controls the action's repository, a commit cannot.
#
# Order matters for the timings: the small-case sweeps run alone, one after
# the other; only the SWE-bench shards overlap, two at a time, and each shard
# runs both arms of its instances itself, so any shared load falls on both.

on:
  workflow_dispatch:
    inputs:
      steps:
        description: Which measurements to run
        type: choice
        options: [all, nemotron, baseline, swebench]
        default: all
      repeat:
        description: Runs per configuration for the small cases
        default: "3"

permissions:
  contents: read

concurrency:
  group: measure
  cancel-in-progress: false

env:
  ARBORIST_BACKEND: contree
  NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
  NEBIUS_PROJECT_ID: ${{ secrets.NEBIUS_PROJECT_ID }}
  TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}

jobs:
  nemotron:
    name: Both arms, every case
    if: inputs.steps == 'all' || inputs.steps == 'nemotron'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Install
        run: |
          uv python install 3.12
          uv venv --python 3.12
          uv pip install -e ".[contree,dev]"
      - name: Sweep
        # A run past its limit exits so the next attempt resumes from it.
        run: |
          for attempt in 1 2 3 4; do
            uv run python evals/run_eval.py --cases all --backend contree --fanout 3 --max-nodes 12 \
              --repeat "${{ inputs.repeat }}" --resume --out evals/results-contree.md && break
            echo "::warning::sweep exited abnormally (attempt $attempt), resuming"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: nemotron
          path: |
            evals/results-contree.md
            evals/results-contree.json
            evals/reports/

  baseline:
    name: Size-matched models, branching arm
    needs: nemotron
    if: ${{ !cancelled() && (inputs.steps == 'all' || inputs.steps == 'baseline') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Install
        run: |
          uv python install 3.12
          uv venv --python 3.12
          uv pip install -e ".[contree,dev]"
      - name: Sweep
        run: |
          for attempt in 1 2 3 4; do
            uv run python evals/run_eval.py --cases all --backend contree --fanout 3 --max-nodes 12 \
              --repeat "${{ inputs.repeat }}" --only on --model-set matched-baseline --resume \
              --out evals/results-contree-baseline.md && break
            echo "::warning::sweep exited abnormally (attempt $attempt), resuming"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: baseline
          path: |
            evals/results-contree-baseline.md
            evals/results-contree-baseline.json
            evals/reports/

  swebench:
    name: SWE-bench Lite, shard ${{ matrix.shard }}/5
    needs: baseline
    if: ${{ !cancelled() && (inputs.steps == 'all' || inputs.steps == 'swebench') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Install
        run: |
          uv python install 3.12
          uv venv --python 3.12
          uv pip install -e ".[contree,dev]"
      - name: Both arms on this shard's validated instances
        run: |
          for attempt in 1 2 3 4; do
            uv run python evals/swebench/run_swebench.py run --shard "${{ matrix.shard }}/5" --resume \
              --reports --out "evals/swebench/results-shard-${{ matrix.shard }}.md" && break
            echo "::warning::shard exited abnormally (attempt $attempt), resuming"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: swebench-shard-${{ matrix.shard }}
          path: |
            evals/swebench/results-shard-${{ matrix.shard }}.md
            evals/swebench/results-shard-${{ matrix.shard }}.json
            evals/swebench/reports/

  swebench-merge:
    name: SWE-bench Lite, all shards
    needs: swebench
    if: ${{ !cancelled() && (inputs.steps == 'all' || inputs.steps == 'swebench') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Install
        run: |
          uv python install 3.12
          uv venv --python 3.12
          uv pip install -e ".[contree,dev]"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: swebench-shard-*
          path: shards
      - name: Merge
        run: |
          uv run python evals/swebench/run_swebench.py merge $(find shards -name 'results-shard-*.json' | sort) \
            --out evals/swebench/results.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: swebench
          path: |
            evals/swebench/results.md
            evals/swebench/results.json
