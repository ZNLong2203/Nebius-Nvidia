[project]
name = "arborist"
version = "0.1.0"
description = "Repairs a failing repository by searching a tree of sandbox states instead of walking one line of attempts."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

dependencies = [
  "openai>=1.40",
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-dotenv>=1.0",
  "rich>=13.7",
  "typer>=0.12",
]

[project.optional-dependencies]
contree = ["contree-sdk==0.3.6"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
arborist = "arborist.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arborist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
# The fixtures are deliberately broken code. Linting them is pointless and
# `--fix` could quietly repair a bug the eval depends on.
extend-exclude = ["examples/", "evals/cases/"]

[tool.ruff.lint]
# B008 is how Typer declares options; PLW1510 is deliberate -- a non-zero exit
# from the test command is the signal we are looking for, not an error.
ignore = ["B008", "PLW1510"]
