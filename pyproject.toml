[project]
name = "arborist"
version = "0.1.0"
description = "Repairs a failing repository by searching a tree of sandbox states instead of walking one line of attempts."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

dependencies = [
  "openai>=1.40",
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-dotenv>=1.0",
  "rich>=13.7",
  "typer>=0.12",
  # Nebius Sandboxes is the default backend, so it is not optional.
  "contree-sdk==0.3.6",
]

[project.optional-dependencies]
# Kept so `pip install -e ".[contree,dev]"` in older instructions still works.
contree = []
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
arborist = "arborist.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arborist"]

# An install from git or a wheel has no checkout around it, so the fallback
# interface and the recorded runs travel inside the package: `arborist serve`
# then opens on a real search wherever it was installed from.
[tool.hatch.build.targets.wheel.force-include]
"ui/index.html" = "arborist/_bundled/ui/index.html"
"evals/evidence" = "arborist/_bundled/evidence"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
# The fixtures are deliberately broken code. Linting them is pointless and
# `--fix` could quietly repair a bug the eval depends on.
extend-exclude = ["examples/", "evals/cases/"]

[tool.ruff.lint]
# B008 is how Typer declares options; PLW1510 is deliberate -- a non-zero exit
# from the test command is the signal we are looking for, not an error.
ignore = ["B008", "PLW1510"]
