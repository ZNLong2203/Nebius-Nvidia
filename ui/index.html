<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arborist</title>
<style>
  :root {
    color-scheme: light;
    --surface-1: #fcfcfb;
    --plane: #f9f9f7;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #898781;
    --grid: #e1e0d9;
    --axis: #c3c2b7;
    --border: rgba(11, 11, 11, 0.10);
    --good: #0ca30c;
    --warning: #fab219;
    --serious: #ec835a;
    --critical: #d03b3b;
    --accent: #2a78d6;
    --accent-soft: rgba(42, 120, 214, 0.12);
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --surface-1: #1a1a19;
      --plane: #0d0d0d;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted: #898781;
      --grid: #2c2c2a;
      --axis: #383835;
      --border: rgba(255, 255, 255, 0.10);
      --accent: #3987e5;
      --accent-soft: rgba(57, 135, 229, 0.18);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-1: #1a1a19;
    --plane: #0d0d0d;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255, 255, 255, 0.10);
    --accent: #3987e5;
    --accent-soft: rgba(57, 135, 229, 0.18);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--plane);
    color: var(--text-primary);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--surface-1);
    display: flex;
    flex-wrap: wrap;
    gap: 10px 14px;
    align-items: center;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; margin-right: 6px; }
  .brand h1 { font-size: 16px; margin: 0; letter-spacing: -0.01em; }
  .brand span { color: var(--text-muted); font-size: 12px; }

  input[type="text"] {
    font: inherit; font-family: var(--mono); font-size: 12.5px;
    color: var(--text-primary);
    background: var(--plane);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 7px 10px;
    min-width: 0;
  }
  input#repo { flex: 2 1 240px; }
  input#test { flex: 2 1 200px; }
  input#setup { flex: 1 1 160px; }

  button {
    font: inherit; font-weight: 600; font-size: 13px;
    border-radius: 7px; padding: 7px 14px; cursor: pointer;
    border: 1px solid var(--border);
    background: var(--plane); color: var(--text-primary);
  }
  button.primary { background: var(--accent); border-color: transparent; color: #fff; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  label.toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text-secondary); white-space: nowrap; }

  .tiles {
    display: flex; flex-wrap: wrap; gap: 1px;
    background: var(--border);
    border-bottom: 1px solid var(--border);
  }
  .tile {
    flex: 1 1 130px; padding: 10px 14px; background: var(--surface-1);
  }
  .tile .k { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); }
  .tile .v { font-size: 20px; font-weight: 600; margin-top: 2px; }
  .tile .s { font-size: 11.5px; color: var(--text-secondary); }

  main { flex: 1; display: flex; min-height: 0; }
  #canvas { flex: 1; overflow: auto; background: var(--plane); position: relative; }
  #canvas svg { display: block; }

  aside {
    width: 420px; flex-shrink: 0; border-left: 1px solid var(--border);
    background: var(--surface-1); overflow-y: auto; padding: 16px;
  }
  aside h2 { font-size: 13px; margin: 0 0 4px; letter-spacing: -0.01em; }
  aside .muted { color: var(--text-muted); font-size: 12.5px; }
  aside section { margin-bottom: 18px; }
  aside h3 {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--text-muted); margin: 0 0 6px; font-weight: 600;
  }
  pre {
    font-family: var(--mono); font-size: 11.5px; line-height: 1.45;
    background: var(--plane); border: 1px solid var(--border); border-radius: 7px;
    padding: 10px; overflow-x: auto; margin: 0; white-space: pre-wrap; word-break: break-word;
  }
  pre.diff .add { color: var(--good); }
  pre.diff .del { color: var(--critical); }
  pre.diff .hunk { color: var(--accent); }

  .badge {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11.5px; font-weight: 600; border-radius: 999px;
    padding: 2px 9px 2px 7px; border: 1px solid var(--border);
    color: var(--text-primary); background: var(--plane);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  ul.plain { margin: 0; padding-left: 16px; font-size: 12.5px; color: var(--text-secondary); }
  ul.plain li { font-family: var(--mono); font-size: 11.5px; }

  table.nodes { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.nodes th, table.nodes td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--grid); }
  table.nodes th { color: var(--text-muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; }
  table.nodes td.num { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--mono); }

  .notice {
    display: none;
    gap: 10px; align-items: baseline;
    padding: 9px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--accent-soft);
    font-size: 12.5px; color: var(--text-secondary);
  }
  .notice.on { display: flex; flex-wrap: wrap; }
  .notice strong { color: var(--text-primary); }
  .notice.warn { background: color-mix(in srgb, var(--warning) 14%, transparent); }

  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; padding: 8px 16px; border-bottom: 1px solid var(--border); background: var(--surface-1); font-size: 12px; color: var(--text-secondary); }
  .legend .item { display: inline-flex; align-items: center; gap: 6px; }

  .empty { padding: 48px 24px; text-align: center; color: var(--text-muted); max-width: 520px; margin: 0 auto; }
  .empty code { font-family: var(--mono); font-size: 12px; background: var(--surface-1); padding: 2px 6px; border-radius: 5px; border: 1px solid var(--border); }

  .node-card { cursor: pointer; }
  .node-card rect.body { fill: var(--surface-1); stroke: var(--axis); stroke-width: 1; }
  .node-card.selected rect.body { stroke: var(--accent); stroke-width: 2; }
  .node-card.invalid rect.body { stroke-dasharray: 4 3; }
  .node-card text { font-family: var(--sans); }
  .node-card .title { font-size: 12px; font-weight: 600; fill: var(--text-primary); }
  .node-card .sub { font-size: 11px; fill: var(--text-secondary); font-family: var(--mono); }
  .node-card .stat { font-size: 11px; fill: var(--text-muted); font-family: var(--mono); }
  .edge { fill: none; stroke: var(--axis); stroke-width: 2; }
  .edge.dim { stroke: var(--grid); }
  .edge.win { stroke: var(--good); }

  @media (max-width: 900px) {
    main { flex-direction: column; }
    aside { width: auto; border-left: none; border-top: 1px solid var(--border); max-height: 45vh; }
  }
</style>
</head>
<body>

<header>
  <div class="brand"><h1>Arborist</h1><span>tree search over sandbox states</span></div>
  <input type="text" id="repo" value="examples/broken-invoice" spellcheck="false" aria-label="Repository path">
  <input type="text" id="test" value="python -m pytest -q" spellcheck="false" aria-label="Test command">
  <input type="text" id="setup" value="pip install -r requirements.txt" spellcheck="false" aria-label="Setup command">
  <label class="toggle"><input type="checkbox" id="branching" checked> branching</label>
  <label class="toggle">k <input type="text" id="fanout" value="4" style="width:38px" aria-label="Fanout"></label>
  <button class="primary" id="run">Run</button>
  <button id="view">Table</button>
  <button id="theme" title="Toggle theme">◐</button>
</header>

<div class="notice" id="notice"></div>
<div class="legend" id="legend"></div>
<div class="tiles" id="tiles"></div>

<main>
  <div id="canvas"></div>
  <aside id="panel"></aside>
</main>

<script>
"use strict";

const STATUS = {
  failed:    { label: "baseline",  color: "var(--text-muted)", icon: "○" },
  green:     { label: "green",     color: "var(--good)",       icon: "✓" },
  improved:  { label: "improved",  color: "var(--good)",       icon: "↑" },
  neutral:   { label: "no change", color: "var(--warning)",    icon: "→" },
  regressed: { label: "regressed", color: "var(--critical)",   icon: "↓" },
  invalid:   { label: "unapplied", color: "var(--text-muted)", icon: "✕" },
  running:   { label: "running",   color: "var(--accent)",     icon: "◌" }
};

const state = {
  nodes: new Map(),
  order: [],
  selected: null,
  result: null,
  running: false,
  view: "tree",
  lastEvent: null,
  source: null,
  recorded: null,
  health: null
};

const $ = (id) => document.getElementById(id);

// --------------------------------------------------------------------------
// run control
// --------------------------------------------------------------------------

async function startRun() {
  state.nodes.clear();
  state.order = [];
  state.selected = null;
  state.result = null;
  state.recorded = null;
  state.running = true;
  if (state.source) state.source.close();
  render();

  const body = {
    repo_path: $("repo").value.trim(),
    test_command: $("test").value.trim(),
    setup_command: $("setup").value.trim(),
    branching: $("branching").checked,
    fanout: parseInt($("fanout").value, 10) || 4
  };

  let runId;
  try {
    const res = await fetch("/api/runs", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
    runId = (await res.json()).run_id;
  } catch (err) {
    state.running = false;
    state.error = String(err.message || err);
    render();
    return;
  }

  const source = new EventSource(`/api/runs/${runId}/events`);
  state.source = source;
  source.onmessage = (msg) => {
    handleEvent(JSON.parse(msg.data));
    render();
  };
  source.onerror = () => { source.close(); state.running = false; render(); };
}

function handleEvent(event) {
  state.lastEvent = event;
  if (event.type === "node") {
    const node = event.node;
    if (!state.nodes.has(node.id)) state.order.push(node.id);
    state.nodes.set(node.id, node);
  } else if (event.type === "run_finished") {
    state.result = event.result;
    (event.result.nodes || []).forEach((n) => {
      if (!state.nodes.has(n.id)) state.order.push(n.id);
      state.nodes.set(n.id, n);
    });
  } else if (event.type === "done") {
    state.running = false;
    if (state.source) state.source.close();
  } else if (event.type === "error") {
    state.error = event.message;
  } else if (event.type === "diagnosed") {
    state.diagnosis = event;
  }
}

// --------------------------------------------------------------------------
// layout: a tidy tree, depth on x so the search reads left to right
// --------------------------------------------------------------------------

const NODE_W = 232, NODE_H = 58, GAP_X = 74, GAP_Y = 16, PAD = 28;

function layout() {
  const nodes = state.order.map((id) => state.nodes.get(id));
  if (!nodes.length) return { placed: [], width: 0, height: 0 };

  const children = new Map();
  nodes.forEach((n) => {
    if (!children.has(n.parent_id)) children.set(n.parent_id, []);
    children.get(n.parent_id).push(n);
  });

  const pos = new Map();
  let cursor = 0;

  // Leaves get sequential rows; a parent centres on its children.
  const place = (node) => {
    const kids = children.get(node.id) || [];
    if (!kids.length) {
      const y = cursor;
      cursor += NODE_H + GAP_Y;
      pos.set(node.id, y);
      return y;
    }
    const ys = kids.map(place);
    const y = (Math.min(...ys) + Math.max(...ys)) / 2;
    pos.set(node.id, y);
    return y;
  };

  (children.get(null) || []).forEach(place);

  const placed = nodes
    .filter((n) => pos.has(n.id))
    .map((n) => ({ node: n, x: PAD + n.depth * (NODE_W + GAP_X), y: PAD + pos.get(n.id) }));

  const width = Math.max(...placed.map((p) => p.x + NODE_W)) + PAD;
  const height = Math.max(...placed.map((p) => p.y + NODE_H)) + PAD;
  return { placed, width, height };
}

function winningPath() {
  const winnerId = state.result && state.result.winner_id;
  const path = new Set();
  let cur = winnerId ? state.nodes.get(winnerId) : null;
  while (cur) {
    path.add(cur.id);
    cur = cur.parent_id ? state.nodes.get(cur.parent_id) : null;
  }
  return path;
}

// --------------------------------------------------------------------------
// render
// --------------------------------------------------------------------------

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function renderLegend() {
  $("legend").innerHTML = Object.entries(STATUS)
    .filter(([k]) => k !== "running")
    .map(([, s]) => `<span class="item"><span class="dot" style="background:${s.color}"></span>${s.icon} ${s.label}</span>`)
    .join("");
}

function renderTiles() {
  const root = state.order.map((id) => state.nodes.get(id)).find((n) => n.depth === 0);
  const baseline = root && root.report;
  const best = state.order
    .map((id) => state.nodes.get(id))
    .filter((n) => n.report)
    .sort((a, b) => b.score - a.score)[0];
  const stats = (state.result && state.result.stats) || {};
  const usage = (state.result && state.result.usage) || {};

  const tiles = [];
  tiles.push(tile("Baseline", baseline ? `${baseline.passed}/${baseline.total}` : "—", "tests passing"));
  tiles.push(tile("Best branch", best && best.report ? `${best.report.passed}/${best.report.total}` : "—",
    best ? `score ${best.score.toFixed(2)}` : state.running ? "searching…" : ""));
  tiles.push(tile("Branches", String(state.order.filter((id) => state.nodes.get(id).depth > 0).length),
    stats.invalid_patches ? `${stats.invalid_patches} never reached the sandbox` : "patches evaluated"));
  tiles.push(tile("Sandbox runs", stats.sandbox_executions != null ? String(stats.sandbox_executions) : "—",
    stats.setup_seconds ? `setup ${stats.setup_seconds}s paid once` : " "));
  if (stats.setup_seconds_saved) {
    tiles.push(tile("Saved by forking", `${stats.setup_seconds_saved}s`, "setup not re-run"));
  }
  const byTier = usage.by_tier || {};
  const totalTok = Object.values(byTier).reduce((a, u) => a + (u.total_tokens || 0), 0);
  if (totalTok) {
    const parts = ["nano", "super", "ultra"]
      .filter((t) => byTier[t] && byTier[t].calls)
      .map((t) => `${t} ${byTier[t].calls}`)
      .join(" · ");
    tiles.push(tile("Nemotron tokens", totalTok.toLocaleString(), parts));
  }
  $("tiles").innerHTML = tiles.join("");
}

function tile(k, v, s) {
  return `<div class="tile"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div><div class="s">${esc(s || " ")}</div></div>`;
}

function renderCanvas() {
  const canvas = $("canvas");
  if (!state.order.length) {
    canvas.innerHTML = `<div class="empty">
      <p>${state.running ? "Preparing the base checkpoint…" : "No run yet."}</p>
      <p>Point it at a repository whose tests fail and press <strong>Run</strong>.
      The bundled example is <code>examples/broken-invoice</code> — four red tests, three unrelated bugs.</p>
      ${state.error ? `<p style="color:var(--critical)">${esc(state.error)}</p>` : ""}
    </div>`;
    return;
  }

  if (state.view === "table") { renderTable(canvas); return; }

  const { placed, width, height } = layout();
  const path = winningPath();
  const byId = new Map(placed.map((p) => [p.node.id, p]));

  const edges = placed
    .filter((p) => p.node.parent_id && byId.has(p.node.parent_id))
    .map((p) => {
      const parent = byId.get(p.node.parent_id);
      const x1 = parent.x + NODE_W, y1 = parent.y + NODE_H / 2;
      const x2 = p.x, y2 = p.y + NODE_H / 2;
      const mid = (x1 + x2) / 2;
      const cls = path.has(p.node.id) && path.has(parent.node.id) ? "edge win"
        : p.node.status === "invalid" || p.node.status === "regressed" ? "edge dim" : "edge";
      return `<path class="${cls}" d="M${x1},${y1} C${mid},${y1} ${mid},${y2} ${x2},${y2}"/>`;
    })
    .join("");

  const cards = placed.map(({ node, x, y }) => {
    const s = STATUS[node.status] || STATUS.running;
    const title = node.depth === 0
      ? "baseline"
      : (node.hypothesis && node.hypothesis.title) || node.note || "patch";
    const passing = node.report ? `${node.report.passed}/${node.report.total} passing` : node.note || "—";
    const extra = node.regressions && node.regressions.length ? ` · broke ${node.regressions.length}` : "";
    const selected = state.selected === node.id ? " selected" : "";
    return `<g class="node-card ${node.status}${selected}" transform="translate(${x},${y})" data-id="${node.id}" role="button" tabindex="0">
      <rect class="body" width="${NODE_W}" height="${NODE_H}" rx="9"/>
      <rect width="4" height="${NODE_H}" rx="2" fill="${s.color}"/>
      <text class="title" x="14" y="21">${esc(s.icon)} ${esc(clip(title, 26))}</text>
      <text class="sub" x="14" y="37">${esc(passing)}${esc(extra)}</text>
      <text class="stat" x="14" y="51">${node.depth === 0 ? "start" : "score " + node.score.toFixed(2)}${node.wall_seconds ? " · " + node.wall_seconds + "s" : ""}</text>
    </g>`;
  }).join("");

  canvas.innerHTML = `<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">
    <g>${edges}</g><g>${cards}</g></svg>`;

  canvas.querySelectorAll(".node-card").forEach((el) => {
    const select = () => { state.selected = el.dataset.id; render(); };
    el.addEventListener("click", select);
    el.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(); } });
  });
}

function clip(s, n) { s = String(s || ""); return s.length > n ? s.slice(0, n - 1) + "…" : s; }

function renderTable(canvas) {
  const rows = state.order.map((id) => state.nodes.get(id)).map((n) => {
    const s = STATUS[n.status] || STATUS.running;
    const title = n.depth === 0 ? "baseline" : (n.hypothesis && n.hypothesis.title) || n.note || "";
    return `<tr>
      <td><span class="dot" style="background:${s.color};display:inline-block;margin-right:6px"></span>${s.icon} ${esc(s.label)}</td>
      <td class="num">${n.depth}</td>
      <td>${esc(clip(title, 60))}</td>
      <td class="num">${n.report ? n.report.passed + "/" + n.report.total : "—"}</td>
      <td class="num">${n.depth === 0 ? "—" : n.score.toFixed(2)}</td>
      <td class="num">${n.regressions.length || ""}</td>
    </tr>`;
  }).join("");
  canvas.innerHTML = `<div style="padding:16px"><table class="nodes">
    <thead><tr><th>status</th><th>depth</th><th>hypothesis</th><th>passing</th><th>score</th><th>broke</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}

function renderPanel() {
  const panel = $("panel");
  const node = state.selected ? state.nodes.get(state.selected) : null;

  if (!node) {
    const d = state.diagnosis;
    panel.innerHTML = `
      <section>
        <h2>How to read this</h2>
        <p class="muted">Every card is an immutable repository state. Depth to the right means
        a patch was built <em>on top of</em> the one before it; siblings are rival theories of
        the same failure, each tested from the same checkpoint.</p>
      </section>
      ${d ? `<section><h3>Latest diagnosis · ${esc(d.tier)}</h3><pre>${esc(d.root_cause || "")}</pre>
        ${d.searched ? `<p class="muted" style="margin-top:6px">Tavily: <code>${esc(d.search_query)}</code></p>` : ""}</section>` : ""}
      ${state.result ? renderSummary() : ""}
      <section class="muted">Select a card to see its patch.</section>`;
    return;
  }

  const s = STATUS[node.status] || STATUS.running;
  const r = node.report;
  panel.innerHTML = `
    <section>
      <span class="badge"><span class="dot" style="background:${s.color}"></span>${s.icon} ${esc(s.label)}</span>
      <h2 style="margin-top:8px">${esc(node.depth === 0 ? "Baseline state" : (node.hypothesis && node.hypothesis.title) || "Patch")}</h2>
      <p class="muted">${esc(node.id)} · depth ${node.depth}${node.checkpoint_id ? " · checkpoint " + esc(node.checkpoint_id.slice(0, 12)) : ""}</p>
    </section>

    ${r ? `<section><h3>Tests</h3>
      <p style="margin:0">${r.passed}/${r.total} passing${r.failed ? ` · ${r.failed} failed` : ""}${r.errors ? ` · ${r.errors} errored` : ""}</p>
      ${node.fixed.length ? `<h3 style="margin-top:10px">Fixed</h3><ul class="plain">${node.fixed.map((t) => `<li>${esc(t)}</li>`).join("")}</ul>` : ""}
      ${node.regressions.length ? `<h3 style="margin-top:10px" >Broke</h3><ul class="plain">${node.regressions.map((t) => `<li>${esc(t)}</li>`).join("")}</ul>` : ""}
      ${r.failed_ids && r.failed_ids.length ? `<h3 style="margin-top:10px">Still failing</h3><ul class="plain">${r.failed_ids.map((t) => `<li>${esc(t)}</li>`).join("")}</ul>` : ""}
    </section>` : ""}

    ${node.hypothesis && node.hypothesis.rationale ? `<section><h3>Rationale</h3><p class="muted" style="margin:0">${esc(node.hypothesis.rationale)}</p></section>` : ""}
    ${node.explanation ? `<section><h3>What the patch does</h3><p class="muted" style="margin:0">${esc(node.explanation)}</p></section>` : ""}
    ${node.note ? `<section><h3>Note</h3><p class="muted" style="margin:0">${esc(node.note)}</p></section>` : ""}
    ${node.edits && node.edits.length ? `<section><h3>Edits</h3>${node.edits.map(renderEdit).join("")}</section>` : ""}
    ${node.stdout_tail ? `<section><h3>Test output</h3><pre>${esc(node.stdout_tail.slice(-2500))}</pre></section>` : ""}`;
}

function renderEdit(edit) {
  if (edit.new_content != null) {
    return `<p class="muted" style="margin:0 0 4px"><code>${esc(edit.path)}</code> — rewritten</p>
      <pre>${esc(clip(edit.new_content, 1400))}</pre>`;
  }
  return `<p class="muted" style="margin:0 0 4px"><code>${esc(edit.path)}</code></p>
    <pre class="diff">${(edit.search || "").split("\n").map((l) => `<span class="del">- ${esc(l)}</span>`).join("\n")}
${(edit.replace || "").split("\n").map((l) => `<span class="add">+ ${esc(l)}</span>`).join("\n")}</pre>`;
}

function renderSummary() {
  const res = state.result;
  const diff = (res.diff || "").split("\n").map((l) => {
    const cls = l.startsWith("+") ? "add" : l.startsWith("-") ? "del" : l.startsWith("@@") ? "hunk" : "";
    return cls ? `<span class="${cls}">${esc(l)}</span>` : esc(l);
  }).join("\n");
  return `<section>
    <h3>Result</h3>
    <p style="margin:0 0 8px">${res.solved ? "✓ suite is green" : "⚠ best branch kept, suite still red"}</p>
    ${res.diff ? `<pre class="diff">${diff}</pre>` : ""}
  </section>`;
}

function render() {
  renderTiles();
  renderCanvas();
  renderPanel();
  $("run").disabled = state.running;
  $("run").textContent = state.running ? "Running…" : "Run";
}

$("run").addEventListener("click", startRun);
$("view").addEventListener("click", () => {
  state.view = state.view === "tree" ? "table" : "tree";
  $("view").textContent = state.view === "tree" ? "Table" : "Tree";
  render();
});
$("theme").addEventListener("click", () => {
  const root = document.documentElement;
  root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark";
});

// ---------------------------------------------------------------------------
// boot: show a real finished run to anyone who has not configured anything
// ---------------------------------------------------------------------------

function loadReport(result, recorded) {
  state.nodes.clear();
  state.order = [];
  state.selected = null;
  (result.nodes || []).forEach((n) => {
    state.order.push(n.id);
    state.nodes.set(n.id, n);
  });
  state.result = result;
  state.recorded = recorded || null;
}

async function boot() {
  const [health, demo] = await Promise.all([
    fetch("/api/health").then((r) => r.json()).catch(() => null),
    fetch("/api/demo").then((r) => r.json()).catch(() => null)
  ]);
  state.health = health;
  if (demo && demo.available && demo.run) {
    loadReport(demo.run, { source: demo.source, at: demo.recorded_at });
  }
  render();
}

renderLegend();
render();
boot();
</script>
</body>
</html>
